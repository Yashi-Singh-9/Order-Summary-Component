<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Order summary card</title>
</head>
<body>
  <main class="order-summary-card bg-white d-flex flex-column justify-content-center align-items-center rounded-4">
    <img src="images/illustration-hero.svg" alt="Hero Enjoying Music" class="object-fit-cover mb-5">

    <section class="content p4 text-center">
      <h2 class="mb-4">Order Summary</h2>
      <p class="summary mb-4">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

      <div class="plan-info mb-5 d-flex justify-content-between align-items-center p-4 rounded-3">
        <div class="plan d-flex">
          <img src="images/icon-music.svg" alt="Music Icon">
          <div class="info ms-3">
            <span class="plan-type d-block">Annual Plan</span>
            <span class="plan-price">$59.99/year</span>
          </div>
        </div>
        <a href="#" class="change">Change</a>
      </div>

      <button class="btn d-block proceed-btn text-white p-3 mb-4">Proceed to Payment</button>
      <button class="btn d-block cancel-btn mb-4">Cancel Order</button>
    </section>
  </main>
  
  <footer class="text-center">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" class="text-decoration-none fst-italic">Frontend Mentor</a>. 
    Coded by <a href="https://www.linkedin.com/in/yashi-singh-b4143a246" target="_blank" class="text-decoration-none fst-italic">Yashi Singh</a>.
  </footer>
</body>
</html>
